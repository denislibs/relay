# Наблюдаемость Relay (docs/observability.md): метрики, панель, тревоги в Telegram владельцу. Слой поверх любого
# стека — dev или боевого, путь к файлам — от корня репозитория (каталог первого -f):
#   docker compose -f docker-compose.yml [-f docker-compose.secure.yml -f deploy/docker-compose.prod.yml] \
#     -f deploy/docker-compose.observability.yml --profile observability up -d
#
#   victoriametrics — хранит ряды 30 дней, сам опрашивает цели (deploy/observability/victoriametrics/scrape.yml):
#                     server и worker (:9091, внутренний порт, мимо nginx), coturn (:9641), LiveKit (:6789),
#                     node-exporter (диски, память хоста), cadvisor (память и CPU контейнеров);
#   vmalert         — правила тревог (deploy/observability/vmalert/alerts.yml) → alertmanager → бот Telegram
#                     (свой бот, не тот, что шлёт коды входа: секрет alert_bot_token; чат — TELEGRAM_OWNER_CHAT_ID);
#   grafana         — панель «Relay» по сборкам; только 127.0.0.1:3001 — открывать через ssh -L, наружу не публикуется.
#
# Наружу не опубликовано ничего; все сервисы — с пределом памяти, вместе ≈ 600 МБ.
# Секреты — файлами, как у остального боевого стека (docker-compose.secure.yml): secrets/run/alert_bot_token и
# secrets/run/grafana_admin_password (deploy/make-secrets.sh), в окружении и аргументах их нет. Процессы здесь не
# root — им добавлена группа 1000, которой открыты файлы секретов (640).
# На боевом сервере слой подключает deploy/lib.sh, если в .env RELAY_OBSERVABILITY=1.
x-obs: &obs
  profiles: ["observability"]
  restart: unless-stopped
  read_only: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  victoriametrics:
    <<: *obs
    image: victoriametrics/victoria-metrics:v1.110.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=30d
      - -promscrape.config=/etc/vm/scrape.yml
      - -promscrape.config.strictParse=true
      - -memory.allowedBytes=120MB
      - -search.maxUniqueTimeseries=50000
      - -httpListenAddr=:8428
    volumes:
      - vmdata:/storage
      - ./deploy/observability/victoriametrics/scrape.yml:/etc/vm/scrape.yml:ro
    mem_limit: 220m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8428/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  vmalert:
    <<: *obs
    image: victoriametrics/vmalert:v1.110.0
    command:
      - -datasource.url=http://victoriametrics:8428
      - -remoteRead.url=http://victoriametrics:8428      # состояние тревог переживает перезапуск
      - -remoteWrite.url=http://victoriametrics:8428
      - -notifier.url=http://alertmanager:9093
      - -rule=/etc/vmalert/alerts.yml
      - -evaluationInterval=30s
      - -external.label=env=production
    volumes:
      - ./deploy/observability/vmalert/alerts.yml:/etc/vmalert/alerts.yml:ro
    mem_limit: 40m
    depends_on: [victoriametrics, alertmanager]

  # токен бота — файлом (bot_token_file → docker secret); id чата alertmanager в конфиг сам не подставляет, поэтому
  # конфиг собирается при старте в tmpfs
  alertmanager:
    <<: *obs
    image: prom/alertmanager:v0.28.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        [ -s /run/secrets/alert_bot_token ] || { echo "secrets/run/alert_bot_token is empty (deploy/set-secret.sh alert_bot_token)" >&2; exit 1; }
        case "$$TELEGRAM_OWNER_CHAT_ID" in ''|*[!0-9-]*) echo "TELEGRAM_OWNER_CHAT_ID must be a number" >&2; exit 1;; esac
        umask 077
        sed "s/__TELEGRAM_OWNER_CHAT_ID__/$$TELEGRAM_OWNER_CHAT_ID/" /etc/alertmanager/alertmanager.yml > /run/am/alertmanager.yml
        exec /bin/alertmanager --config.file=/run/am/alertmanager.yml --storage.path=/alertmanager --web.listen-address=:9093 --cluster.listen-address=
    environment:
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:?set TELEGRAM_OWNER_CHAT_ID}
    secrets: [alert_bot_token]
    group_add: ["1000"]
    volumes:
      - ./deploy/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - amdata:/alertmanager
    tmpfs: ["/run/am:size=1m,mode=0700,uid=65534"]
    mem_limit: 40m

  # диски (в т. ч. /srv/relay-s3), память и CPU хоста; файловые системы хоста — только чтение
  node-exporter:
    <<: *obs
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
      - --no-collector.wifi
      - --no-collector.hwmon
      - --no-collector.infiniband
      - --no-collector.ipvs
      - --no-collector.nfs
      - --no-collector.nfsd
      - --no-collector.zfs
      - --no-collector.btrfs
      - --no-collector.xfs
      - --collector.processes   # число процессов по состоянию: тревога RelayZombieProcesses
    pid: host
    volumes:
      - /:/host:ro,rslave
    mem_limit: 30m

  # память и CPU по контейнерам (метка — имя сервиса compose); лишние группы метрик выключены — так он лёгкий
  cadvisor:
    <<: *obs
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --max_housekeeping_interval=60s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,disk,diskIO,hugetlb,memory_numa,percpu,perf_event,process,referenced_memory,resctrl,sched,tcp,udp
      - --enable_load_reader=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices: ["/dev/kmsg"]
    privileged: true   # cgroups хоста; наружу ничего не открыто, сеть — внутренняя compose
    read_only: false
    mem_limit: 110m

  # только с этой машины: ssh -L 3001:127.0.0.1:3001 <сервер>, затем http://localhost:3001 (docs/observability.md)
  grafana:
    <<: *obs
    image: grafana/grafana-oss:12.0.2
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/relay.json
      GF_LOG_LEVEL: warn
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets: [grafana_admin_password]
    group_add: ["1000"]
    tmpfs: ["/tmp:size=16m"]
    mem_limit: 160m
    depends_on: [victoriametrics]

secrets:
  alert_bot_token: { file: ./secrets/run/alert_bot_token }
  grafana_admin_password: { file: ./secrets/run/grafana_admin_password }

volumes:
  vmdata: {}
  amdata: {}
  grafanadata: {}
