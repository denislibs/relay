# Проверки на каждый PR и push (кроме master — там их вызывает deploy.yml перед выкатом, тем же файлом).
# Задания независимы и идут параллельно; обязательные для master — docs/deploy.md, «Обязательные проверки».
#   secrets          — gitleaks: PR — только его коммиты, push — вся история (.gitleaks.toml, .gitleaksignore)
#   typecheck        — apps/web (код и тесты), packages/protocol
#   unit             — bun test: apps/web, packages/relay-ui, packages/protocol, tools/ci
#   migration lint   — новые миграции совместимы с прежним кодом (tools/ci/migration-lint.ts)
#   web build        — продакшен-сборка клиента (apps/web/build.ts)
#   server / engine  — тесты сервера и движка на настоящих Postgres, Valkey, S3, поиске (профиль test, как локально)
#   images           — оба образа собираются (без публикации)
name: ci

on:
  pull_request:
  push:
    branches-ignore: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.4.4          # как в apps/server/Dockerfile
  TYPESCRIPT_VERSION: 5.6.3
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned, checksum verified)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
      - name: scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # PR — только его коммиты; push и вызов из deploy — вся история. Находка — провал; значения — скрыты (--redact)
          if [ -n "$BASE_SHA" ]; then range=(--log-opts="$BASE_SHA..$HEAD_SHA"); else range=(); fi
          "$RUNNER_TEMP/gitleaks" git . --no-banner --redact --verbose --exit-code 1 \
            --config .gitleaks.toml --gitleaks-ignore-path .gitleaksignore "${range[@]}"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: apps/web (code)
        run: bunx -p typescript@${{ env.TYPESCRIPT_VERSION }} tsc --noEmit -p apps/web
      - name: apps/web (tests)
        if: always()
        run: bunx -p typescript@${{ env.TYPESCRIPT_VERSION }} tsc --noEmit -p apps/web/tsconfig.test.json
      - name: packages/protocol
        if: always()
        run: bunx -p typescript@${{ env.TYPESCRIPT_VERSION }} tsc --noEmit -p packages/protocol

  unit:
    name: unit (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [apps/web, packages/relay-ui, packages/protocol, tools/ci]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: bun test
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          # tools/ci читает файлы репозитория по путям от корня — оттуда и запускается
          if [ "$SUITE" = tools/ci ]; then bun test tools/ci; else cd "$SUITE" && bun test; fi

  migrations:
    name: migration lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # сравнение с базой
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: migration lint
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          # PR — против базы; push — против прежней головы ветки; новая ветка (before = 0…0) — против master
          if [ -n "$BASE_REF" ]; then base="origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base="$BEFORE"
          else base=origin/master
          fi
          echo "base: $base"
          bun tools/ci/migration-lint.ts "$base"

  web-build:
    name: web build (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: apps/web/build.ts
        env:
          BUILD_ID: ${{ github.sha }}
        run: WEB_OUT="$RUNNER_TEMP/dist" bun apps/web/build.ts && test -s "$RUNNER_TEMP/dist/index.html"

  server-tests:
    name: server tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: start KMS (OpenBao dev) for the Vault tests
        run: docker compose -f docker-compose.yml --profile test up -d --wait kms
      # один известный нестабильный тест (bus.test.ts: перезапуск Valkey, гонка во времени) — повтор один раз, только он;
      # любая другая ошибка или повторный провал — красный CI
      - name: bun test (apps/server)
        env:
          FLAKY: a socket opened after Valkey lost the process key still counts
        run: |
          set +e
          docker compose -f docker-compose.yml --profile test run --rm -T test 2>&1 | tee server-tests.log
          code=${PIPESTATUS[0]}
          [ "$code" = 0 ] && exit 0
          failed=$(grep -E '^\(fail\)' server-tests.log | sort -u)
          echo "failed:"; echo "$failed"
          if [ -n "$failed" ] && ! echo "$failed" | grep -vqF "$FLAKY"; then
            echo "::warning::only the known flaky test failed — retrying it once: $FLAKY"
            docker compose -f docker-compose.yml --profile test run --rm -T test bun test test/bus.test.ts -t "$FLAKY"
            exit $?
          fi
          exit "$code"
      - name: logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile test logs --tail=200
      - if: always()
        run: docker compose -f docker-compose.yml --profile test down -v

  engine-tests:
    name: engine tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: bun test (packages/sync-engine)
        run: docker compose -f docker-compose.yml --profile test run --rm test-engine
      - name: logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --profile test logs --tail=200
      - if: always()
        run: docker compose -f docker-compose.yml --profile test down -v

  images:
    name: build images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: relay-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          build-args: BUILD_ID=${{ github.sha }}   # сборка = тег образа = /version.json клиента
          push: false
          cache-from: type=gha,scope=relay-server
          cache-to: type=gha,mode=max,scope=relay-server
      - name: relay-proxy
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/nginx
          build-contexts: repo=.
          target: production
          build-args: BUILD_ID=${{ github.sha }}
          push: false
          cache-from: type=gha,scope=relay-proxy
          cache-to: type=gha,mode=max,scope=relay-proxy
