# location @api: запросы к Bun. Несколько limit_req — действуют все; пустой ключ зоны (не тот путь) не считается.
# nodelay: всплеск в пределах burst проходит сразу, сверх него — 429 (ждать в очереди nginx нечего).
limit_req zone=relay_api burst=200 nodelay;
limit_req zone=relay_auth burst=10 nodelay;
limit_req zone=relay_upload burst=60 nodelay;
limit_req zone=relay_webhook burst=100 nodelay;
# webhook бота — не с адреса Telegram: как неверный секрет (404). Перед Cloudflare адрес верный только с relay-cloudflare.conf
if ($relay_webhook_denied) { return 404; }
# тело запроса API — JSON (файлы идут в :8333 мимо Bun): больше — не клиент
client_max_body_size 4m;
