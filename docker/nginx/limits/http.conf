# Антифлуд на входе (docs/protection.md): зоны limit_req/limit_conn по адресу клиента. Уровень http —
# подключается первой строкой production.conf. Пределы на пользователя (сообщения, звонки, поиск…) — на сервере
# (apps/server/src/domain/flood.ts); здесь — грубое сито по IP, чтобы поток не дошёл до Bun.
# За одним адресом бывает много людей (мобильный CGNAT, офис) — пределы с запасом, всплески — через burst.
# Сниппеты лежат в образе (docker/nginx/Dockerfile → /etc/nginx/snippets/limits/): правка — пересборка proxy.

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;

# все соединения (в HTTP/2 каждый одновременный запрос считается отдельным соединением)
limit_conn_zone $binary_remote_addr zone=relay_conn:10m;
# API: запросы к Bun (всё, что не статика)
limit_req_zone $binary_remote_addr zone=relay_api:10m rate=20r/s;

# вход: запрос кода, проверка кода и пароля, начало входа через Telegram и QR — строго. Опросы (/auth/*/poll) и
# /auth/config — в общей зоне API (опрос идёт раз в 2 с). Пустой ключ — запрос в зоне не считается.
map $uri $relay_auth_key {
  ~^/auth/(code|signin|signup|password/check|password/recover|password/recover/check|telegram|qr|passkey/finish)$ $binary_remote_addr;
  default "";
}
limit_req_zone $relay_auth_key zone=relay_auth:10m rate=10r/m;

# заявки на загрузку файлов (/uploads…): тело идёт мимо Bun в :8333, но каждая заявка — запись в базе и подпись
map $uri $relay_upload_key { ~^/uploads(/|$) $binary_remote_addr; default ""; }
limit_req_zone $relay_upload_key zone=relay_upload:10m rate=5r/s;

# webhook бота Telegram: только с адресов Telegram (core.telegram.org/bots/webhooks) — секрет в заголовке
# сервер проверяет и так, это ещё и сито. Адреса Telegram меняются редко; поменялись — дополнить здесь.
geo $relay_from_telegram {
  default 0;
  149.154.160.0/20 1;
  91.108.4.0/22 1;
}
map "$uri:$relay_from_telegram" $relay_webhook_denied { "/auth/telegram/webhook:0" 1; default 0; }
map $uri $relay_webhook_key { /auth/telegram/webhook $binary_remote_addr; default ""; }
limit_req_zone $relay_webhook_key zone=relay_webhook:1m rate=30r/s;

# WebSocket: новые подключения в секунду и одновременно открытые с адреса
limit_req_zone $binary_remote_addr zone=relay_ws:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=relay_ws_conn:10m;

# LiveKit (групповые звонки): сигналинг WebSocket и /rtc/validate
limit_req_zone $binary_remote_addr zone=relay_lk:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=relay_lk_conn:10m;

# :8333 — медиа из S3 по подписанным ссылкам: экран чата тянет десятки превью разом
limit_req_zone $binary_remote_addr zone=relay_media:10m rate=50r/s;
