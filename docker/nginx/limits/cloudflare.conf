# Настоящий адрес клиента за Cloudflare. ВЫКЛЮЧЕНО: production.conf это не подключает, пока Cloudflare не стоит
# перед сервером (план — docs/protection.md, «Cloudflare»). Включить — раскомментировать include в production.conf
# (уровень http, рядом с limits/http.conf).
#
# Без этого за Cloudflare $remote_addr — адрес Cloudflare: все лимиты по IP стали бы общими на всех, а webhook
# Telegram отсекался бы. С этим — адрес клиента из CF-Connecting-IP, но ТОЛЬКО если соединение пришло от Cloudflare:
# с прочих адресов заголовок игнорируется (подделать его напрямую нельзя). Порт 443 тогда стоит закрыть для всех,
# кроме этих сетей (файрвол VPS), иначе Cloudflare обходят.
# Bun берёт адрес из X-Forwarded-For справа (TRUST_PROXY=1): nginx дописывает туда уже настоящий $remote_addr.
#
# Сети Cloudflare — https://www.cloudflare.com/ips/ (сверить перед включением, меняются редко).
