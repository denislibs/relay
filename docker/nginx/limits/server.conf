# Уровень server (оба виртуальных хоста production.conf): тайм-ауты против slowloris, соединения с адреса и
# ответ 429 в виде JSON сервера — клиент разбирает {code: 'flood', retryAfter} одинаково от nginx и от Bun.

# медленный клиент держит соединение открытым: заголовки — за 10 с, тело — без пауз дольше 20 с между кусками,
# ответ — без пауз дольше 30 с; простаивающее keep-alive — 30 с. Оборванные по тайм-ауту — сбросом, без FIN_WAIT.
client_header_timeout 10s;
client_body_timeout 20s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;

# одновременных запросов с адреса (HTTP/2: каждый поток — соединение; за адресом CGNAT — тысячи людей). В /ws и /livekit/ — свои зоны вместо этой
limit_conn relay_conn 2000;

error_page 429 @relay_flood;
location @relay_flood {
  default_type application/json;
  add_header Retry-After 5 always;
  return 429 '{"code":"flood","retryAfter":5}';
}
