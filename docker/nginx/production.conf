# PRODUCTION-вход Relay (docker-compose.secure.yml). Отличия от dev.conf (аудит 2026-10-25):
#   - HSTS на всех ответах (INFRA-3); порт 80 только перенаправляет и отдаёт проверку Let's Encrypt;
#   - :8333 пропускает к S3 только подписанные запросы GET/HEAD/PUT к отдельным объектам бакета — без списков,
#     операций с бакетом и подписи заголовком (INFRA-2);
#   - сертификаты — /etc/nginx/certs/server.pem и server-key.pem (настоящий домен, не mkcert).
# Вход в Relay: https, статика клиента из dist (сжатие gzip/brotli), API и WebSocket — в Bun.
# Bun статику не раздаёт: он только API. Медиа браузер берёт из S3 по подписанным ссылкам — через :8333 ниже.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# антифлуд: зоны limit_req/limit_conn по адресу (docs/protection.md); сниппеты — в образе, /etc/nginx/snippets/limits/
include /etc/nginx/snippets/limits/http.conf;
# за Cloudflare — настоящий адрес клиента из CF-Connecting-IP (выключено, см. limits/cloudflare.conf)
# include /etc/nginx/snippets/limits/cloudflare.conf;

# upstream'ы без блока upstream: nginx 1.26 резолвит имя из upstream один раз при старте, и после `compose up --build`
# (новый IP контейнера server) отвечал 502 до перезапуска proxy. Переменная в proxy_pass + resolver Docker DNS —
# имя резолвится заново каждые 10 с. Цена — без keepalive к Bun; для dev это неважно (в relay.conf всё как было).

# :80 — только проверка Let's Encrypt (HTTP-01: certbot --webroot на хосте пишет в /srv/relay-acme, он смонтирован
# сюда, deploy/docker-compose.prod.yml) и перенаправление на https
server {
  listen 80;
  location ^~ /.well-known/acme-challenge/ {
    root /srv/acme;
    default_type text/plain;
    try_files $uri =404;
  }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server-key.pem;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $relay_api http://server:3000;
  set $relay_s3 http://s3:8333;
  include /etc/nginx/snippets/limits/server.conf;
  # www.<домен> → <домен>: подписанные ссылки S3, CSP и passkeys привязаны к одному имени
  if ($host ~* "^www\.(.+)$") { return 301 https://$1$request_uri; }

  root /srv/dist;
  # CSP, Trusted Types и прочие заголовки страницы (location со своими add_header подключают их сами)
  include /etc/nginx/snippets/relay-security.conf;
  include /etc/nginx/snippets/relay-hsts.conf;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;

  # готовые .br/.gz рядом с файлом (продакшен-сборка) — без работы на запрос; иначе сжимаем на лету
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;
  brotli on;
  brotli_static on;
  brotli_min_length 1024;
  brotli_comp_level 5;
  brotli_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

  # страницы приложения: корень и ссылки-приглашения /+ключ, /@имя
  location = / { try_files /index.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }
  location ~ "^/([+@][A-Za-z0-9_-]{1,64}|@[A-Za-z0-9_-]{1,64}/[0-9]{1,15}|c/[0-9]{1,15}/[0-9]{1,15})$" { try_files /index.html =404; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }

  # код и стили с хэшем в имени (build.ts): новая сборка — новые имена, поэтому кэш навсегда
  location ~ "-[a-z0-9]{8,}\.(js|css|wasm|tflite|binarypb)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";   # без always: 404 не кэшируем
    include /etc/nginx/snippets/relay-security.conf;
    include /etc/nginx/snippets/relay-hsts.conf;
  }

  # узоры обоев не меняются между сборками (новый узор — новое имя); рядом лежат готовые .svg.gz
  location /patterns/ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }
  # картинки эмодзи (public/emoji): файл на эмодзи, между сборками не меняются
  location /emoji/ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }

  # манифест PWA: в mime.types nginx нет .webmanifest — без этого ушёл бы как application/octet-stream
  location = /manifest.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }
  # иконки приложения меняются редко; новая иконка подтянется через неделю или при переустановке
  location /icons/ { add_header Cache-Control "public, max-age=604800" always; include /etc/nginx/snippets/relay-security.conf; include /etc/nginx/snippets/relay-hsts.conf; }

  # файл из сборки — отдаём сами (перепроверка по ETag), чего нет — это API
  location / {
    try_files $uri @api;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/relay-security.conf;
    include /etc/nginx/snippets/relay-hsts.conf;
  }

  # LiveKit (групповые звонки): сигналинг WebSocket и /rtc/validate — к сервису livekit без префикса /livekit
  location /livekit/ {
    set $relay_lk http://livekit:7880;
    rewrite ^/livekit/(.*)$ /$1 break;
    include /etc/nginx/snippets/limits/livekit.conf;
    proxy_pass $relay_lk;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location = /ws {
    include /etc/nginx/snippets/limits/ws.conf;
    proxy_pass $relay_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location @api {
    include /etc/nginx/snippets/limits/api.conf;
    proxy_pass $relay_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
  }
}

# S3 (SeaweedFS) для браузера: подписанные ссылки скачивания и загрузки. Подпись включает хост —
# поэтому Host пробрасываем как есть (localhost:8333), он же в S3_PUBLIC_ENDPOINT.
server {
  listen 8333 ssl;
  http2 on;
  ssl_certificate     /etc/nginx/certs/server.pem;
  ssl_certificate_key /etc/nginx/certs/server-key.pem;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $relay_api http://server:3000;
  set $relay_s3 https://s3:8333;   # S3 внутри — только https (сертификат внутреннего CA)
  include /etc/nginx/snippets/limits/server.conf;

  # только объекты бакета по подписанной ссылке (X-Amz-Signature в строке запроса): ни списков, ни операций
  # с бакетом, ни запросов с подписью в заголовке Authorization — ими пользуется только сервер, изнутри (INFRA-2)
  location / { return 403; }
  location ~ "^/relay-files/.+" {
    if ($request_method !~ ^(GET|HEAD|PUT|OPTIONS)$) { return 403; }
    if ($http_authorization) { return 403; }
    set $signed "";
    if ($args ~ "(^|&)X-Amz-Signature=") { set $signed "1"; }
    if ($request_method = OPTIONS) { set $signed "1"; }   # предзапрос CORS перед PUT — без подписи по стандарту
    if ($signed = "") { return 403; }
    include /etc/nginx/snippets/limits/media.conf;
    proxy_pass $relay_s3;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/internal-ca.pem;
    proxy_ssl_name s3;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    # Service Worker кэширует начало видео кусками (mediaCache.serveVideoRange): ему нужен полный размер файла
    # из Content-Range, а по CORS этот заголовок скрыт, пока хранилище его явно не откроет
    proxy_hide_header Access-Control-Expose-Headers;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges" always;
  }
}
