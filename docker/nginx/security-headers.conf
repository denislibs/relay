# Заголовки безопасности страницы Relay. Подключается (include) на уровне server и в каждом location со своими
# add_header: в nginx add_header из server не наследуется туда, где есть свои.
#
# Content-Security-Policy — только свои скрипты (файлы с хэшем и integrity, без встроенных и без eval; WASM —
# 'wasm-unsafe-eval' для tlottie), медиа — свои, blob:/data: и хранилище S3 (:8333, подписанные ссылки).
# Trusted Types: строка в innerHTML/DOMParser/адрес воркера — только через политики: default (DOMPurify,
# apps/web/src/trustedTypes.ts), dompurify (её собственная), relay-icons (константы иконок, kit.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://$host:8333; media-src 'self' data: blob: https://$host:8333; connect-src 'self' wss://$host https://$host:8333; font-src 'self' data:; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; require-trusted-types-for 'script'; trusted-types default dompurify relay-icons" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), interest-cohort=()" always;
# production: ещё Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" (на localhost не ставим —
# браузер запомнил бы https для всех локальных портов)
