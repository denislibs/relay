# Production (docker-compose.secure.yml): по сети — только TLS, пароль и клиентский сертификат от внутреннего CA
# (mTLS: базу видят только наши процессы). Без TLS — отказ (INFRA-1). Сокет внутри контейнера — для initdb и проверки.
local   all  all                 trust
hostssl all  all  0.0.0.0/0      scram-sha-256  clientcert=verify-full
hostssl all  all  ::/0           scram-sha-256  clientcert=verify-full
hostnossl all all 0.0.0.0/0      reject
hostnossl all all ::/0           reject
