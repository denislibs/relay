# TURN для звонков (docs/plans/2026-11-06-relay-calls.md, «TURN»). Медиа звонка идёт напрямую, а если нельзя (NAT,
# правило «Пиринговые соединения») — через этот сервер. Он пересылает уже зашифрованный DTLS-SRTP: ключей у него нет.
#
# Учётки — временные, выдаёт сервер Relay на звонок (REST API, HMAC): секрет и внешний адрес передаются флагами
# (--static-auth-secret, --external-ip, --relay-ip, --allowed-peer-ip) из docker/coturn/start.sh.

listening-port=3478
fingerprint
use-auth-secret
realm=relay

# пересылать только UDP; TCP-релей к произвольным адресам не нужен
no-tcp-relay
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# диапазон портов релея (опубликован в docker-compose)
min-port=49160
max-port=49200

# пределы: сессий на учётку, всего, полоса одной сессии (байт/с ≈ 3,2 Мбит/с — видео 720p с запасом)
user-quota=6
total-quota=300
max-bps=400000
stale-nonce=600

# TURN не прокси во внутреннюю сеть: частные, служебные и локальные адреса запрещены. Свой внешний адрес (обмен
# между двумя релеями этого сервера) разрешается флагом --allowed-peer-ip (start.sh).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
denied-peer-ip=100::-100::ffff:ffff:ffff:ffff
denied-peer-ip=2001::-2001:1ff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# в журнал — только служебное (адреса и учётки сессий, без содержимого)
log-file=stdout
simple-log
