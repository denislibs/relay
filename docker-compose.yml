services:
  postgres:
    image: postgres:17-alpine
    # wal_compression: журнал и счётчики на каждого получателя пишут много WAL (≈27 КБ на сообщение в группе на 50);
    # shared_buffers: дефолт 128 МБ мал для messages (≈120 МБ) с индексами
    command: ["postgres", "-c", "wal_compression=on", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB"]
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["127.0.0.1:5433:5432"]   # только с этой машины (INFRA-6)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  # эфемерное состояние (онлайн, рассылка кадров между процессами сервера): без записи на диск
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-хранилище вложений: SeaweedFS (Apache-2.0). MinIO community больше не выпускает образы (см. docs/plans/2026-10-18-s3-storage.md).
  # Один процесс: master + volume + filer + S3-шлюз. -ip=s3 — адрес, который мастер раздаёт другим контейнерам (s3-init).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    # наружу — только через proxy (https://localhost:8333): браузер ходит туда по подписанным ссылкам
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # одноразово: бакет relay-files (идемпотентно)
  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "/init-bucket.sh"]
    environment:
      MASTER: s3:9333
      BUCKET: relay-files
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3: { condition: service_healthy }

  # KMS (OpenBao — открытый Vault, движок Transit): проверка настоящего пути главного ключа в тестах.
  # dev-режим держит ключи в памяти — для dev-стека и тестов основного набора KMS_PROVIDER=fake (crypto/kms.ts)
  kms:
    image: openbao/openbao:2.7.2
    profiles: ["test", "kms"]
    command: ["server", "-dev", "-dev-root-token-id=relay-dev-root", "-dev-listen-address=0.0.0.0:8200"]
    cap_add: [IPC_LOCK]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # поиск сообщений (MIT, Community Edition): только текст и id чата, права проверяет сервер; порт наружу не публикуется
  search:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
    volumes:
      - ./apps:/app/apps    # свежие миграции без пересборки образа
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "apps/web/build.ts", "--watch"]
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "--watch", "apps/server/src/main.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      PORT: "3000"
      DEV_LOGIN: "${DEV_LOGIN:-0}"                 # вход по имени и коды без SMS; включить: DEV_LOGIN=1 docker compose up -d
      LOG_LOGIN_CODES: "${LOG_LOGIN_CODES:-1}"     # коды входа и восстановления — в лог сервера/воркера (SMS и почты нет)
      CODE_DELIVERY: "${CODE_DELIVERY:-}"           # dev | log | telegram; пусто — по DEV_LOGIN / LOG_LOGIN_CODES (docs/code-delivery.md)
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_OWNER_CHAT_ID: "${TELEGRAM_OWNER_CHAT_ID:-}"
      TELEGRAM_API_URL: "${TELEGRAM_API_URL:-}"     # пусто — api.telegram.org; для проверки — свой mock
      TELEGRAM_LOGIN: "${TELEGRAM_LOGIN:-0}"        # «Войти через Telegram»: бот подтверждает номер (docs/code-delivery.md)
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:-}"   # пусто — воркер опрашивает getUpdates
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      DEV_MIGRATE: "1"                             # новые migrations/*.sql применяются сами (migrate.watchMigrations)
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      # для подписанных ссылок браузеру (подпись включает хост); это proxy. Публичная ссылка: S3_PUBLIC_ENDPOINT=https://<туннель>
      S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-https://localhost:8333}"
      TRUST_PROXY: "1"                             # перед сервером ровно один прокси (nginx): X-Forwarded-* от него
      VALKEY_URL: redis://valkey:6379
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      # звонки: STUN/TURN — сервис turn ниже; учётки на звонок подписываются этим секретом (domain/calls.ts)
      RELAY_STUN_URLS: "stun:${RELAY_TURN_HOST:-127.0.0.1}:${RELAY_TURN_PORT:-3478}"
      RELAY_TURN_URLS: "turn:${RELAY_TURN_HOST:-127.0.0.1}:${RELAY_TURN_PORT:-3478}?transport=udp,turn:${RELAY_TURN_HOST:-127.0.0.1}:${RELAY_TURN_PORT:-3478}?transport=tcp"
      RELAY_TURN_SECRET: "${RELAY_TURN_SECRET:-relay-dev-turn-secret}"
      # групповые звонки: LiveKit (сервис livekit ниже) — пропуски подписываются этим ключом (domain/groupCalls.ts)
      LIVEKIT_URL: http://livekit:7880
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-relaydev}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-relay-dev-livekit-secret-0123456789abcdef}"
    # наружу не открыт: только API за proxy
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

  # TURN/STUN для звонков (coturn, BSD): медиа идёт мимо сервера Relay, через TURN — только когда напрямую нельзя.
  # external-ip — адрес, который видят браузеры (dev — 127.0.0.1); docker/coturn/start.sh связывает его с адресом контейнера
  turn:
    image: coturn/coturn:4.6.3
    entrypoint: ["sh", "/start.sh"]
    environment:
      RELAY_TURN_SECRET: "${RELAY_TURN_SECRET:-relay-dev-turn-secret}"
      RELAY_TURN_EXTERNAL_IP: "${RELAY_TURN_EXTERNAL_IP:-127.0.0.1}"
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/start.sh:/start.sh:ro
    ports: ["${RELAY_BIND:-127.0.0.1}:${RELAY_TURN_PORT:-3478}:3478/udp", "${RELAY_BIND:-127.0.0.1}:${RELAY_TURN_PORT:-3478}:3478/tcp",
            "${RELAY_BIND:-127.0.0.1}:49160-49200:49160-49200/udp"]

  # LiveKit (Apache-2.0) — сервер-пересыльщик групповых звонков. Сигналинг — через proxy (wss://<host>/livekit),
  # медиа — UDP 50000–50060 / TCP 7881 напрямую. node-ip — адрес, который видят браузеры (dev — 127.0.0.1)
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${LIVEKIT_NODE_IP:-127.0.0.1}"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-relaydev}: ${LIVEKIT_API_SECRET:-relay-dev-livekit-secret-0123456789abcdef}"
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports: ["${RELAY_BIND:-127.0.0.1}:7881:7881/tcp", "${RELAY_BIND:-127.0.0.1}:50000-50060:50000-50060/udp"]

  # Вход: https://localhost — статика из dist (gzip/brotli), API и WebSocket → server, :8333 → S3.
  # Сертификат: docker/nginx/dev-cert.sh (mkcert).
  proxy:
    build: { context: docker/nginx }
    # dev — только с этой машины: здесь работают /dev/login (вход в любой аккаунт по имени) и коды входа (INFRA-6)
    # нужен доступ с телефона в той же сети — RELAY_BIND=0.0.0.0 (и помните про /dev/login)
    ports: ["${RELAY_BIND:-127.0.0.1}:443:443", "${RELAY_BIND:-127.0.0.1}:80:80", "${RELAY_BIND:-127.0.0.1}:8333:8333"]
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/relay-security.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./apps/web/dist:/srv/dist:ro
    depends_on:
      server: { condition: service_started }
      web: { condition: service_started }
      s3: { condition: service_healthy }
      livekit: { condition: service_started }

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "--watch", "apps/server/src/worker.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      DEV_LOGIN: "${DEV_LOGIN:-0}"                 # вход по имени и коды без SMS; включить: DEV_LOGIN=1 docker compose up -d
      LOG_LOGIN_CODES: "${LOG_LOGIN_CODES:-1}"     # коды входа и восстановления — в лог сервера/воркера (SMS и почты нет)
      CODE_DELIVERY: "${CODE_DELIVERY:-}"           # dev | log | telegram; пусто — по DEV_LOGIN / LOG_LOGIN_CODES (docs/code-delivery.md)
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_OWNER_CHAT_ID: "${TELEGRAM_OWNER_CHAT_ID:-}"
      TELEGRAM_API_URL: "${TELEGRAM_API_URL:-}"     # пусто — api.telegram.org; для проверки — свой mock
      TELEGRAM_LOGIN: "${TELEGRAM_LOGIN:-0}"        # «Войти через Telegram»: бот подтверждает номер (docs/code-delivery.md)
      TELEGRAM_BOT_USERNAME: "${TELEGRAM_BOT_USERNAME:-}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:-}"   # пусто — воркер опрашивает getUpdates
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-}"
      VALKEY_URL: redis://valkey:6379
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      S3_ENDPOINT: http://s3:8333    # uploads.sweep удаляет объекты брошенных загрузок
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  s3-init-test:
    image: chrislusf/seaweedfs:4.48
    profiles: ["test", "tools"]
    entrypoint: ["sh", "/init-bucket.sh"]
    environment:
      MASTER: s3:9333
      BUCKET: relay-test
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3: { condition: service_healthy }

  # перенос файлов со старого тома /data/files в бакет: docker compose --profile tools run --rm migrate-files
  migrate-files:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["tools"]
    command: ["bun", "apps/server/src/migrateFiles.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      FILES_DIR: /data/files
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
    volumes:
      - ./apps:/app/apps
      - files:/data/files:ro
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  test:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["test"]
    working_dir: /app/apps/server
    command: ["bun", "test"]
    environment:
      VAULT_TEST_ADDR: http://kms:8200
      VAULT_TEST_TOKEN: relay-dev-root
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay_test
      DEV_LOGIN: "1"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-test
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      S3_PUBLIC_ENDPOINT: http://s3:8333
      VALKEY_URL: redis://valkey:6379
      RELAY_BUS_PREFIX: relay_test
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      SEARCH_INDEX_PREFIX: relay_test
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      # зависимости — из образа, а не с хоста: bun кладёт их в node_modules каждого пакета, и монтирование исходников
      # их бы закрыло (на чистом checkout и в CI их на хосте нет). Анонимный том берёт содержимое образа, run --rm его удаляет
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/relay-ui/node_modules
      - /app/packages/sync-engine/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      s3-init-test: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

  test-engine:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["test"]
    working_dir: /app/packages/sync-engine
    command: ["bun", "test"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay_test
      DEV_LOGIN: "1"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-test
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      S3_PUBLIC_ENDPOINT: http://s3:8333
      VALKEY_URL: redis://valkey:6379
      RELAY_BUS_PREFIX: relay_test
      SERVICE_CHAT: "off"   # без приветственного чата «Relay»: тесты считают чаты пользователя точно
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      SEARCH_INDEX_PREFIX: relay_test
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      # зависимости — из образа, а не с хоста: bun кладёт их в node_modules каждого пакета, и монтирование исходников
      # их бы закрыло (на чистом checkout и в CI их на хосте нет). Анонимный том берёт содержимое образа, run --rm его удаляет
      - /app/apps/server/node_modules
      - /app/apps/web/node_modules
      - /app/packages/relay-ui/node_modules
      - /app/packages/sync-engine/node_modules
    depends_on:
      postgres: { condition: service_healthy }
      s3-init-test: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

volumes:
  files:      # прежнее хранилище вложений: только для migrate-files
  pgdata: {}
  s3data: {}
  meili: {}
