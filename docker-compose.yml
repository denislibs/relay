services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 2s
      timeout: 3s
      retries: 30

  # эфемерное состояние (онлайн, рассылка кадров между процессами сервера): без записи на диск
  valkey:
    image: valkey/valkey:8.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-хранилище вложений: SeaweedFS (Apache-2.0). MinIO community больше не выпускает образы (см. docs/plans/2026-10-18-s3-storage.md).
  # Один процесс: master + volume + filer + S3-шлюз. -ip=s3 — адрес, который мастер раздаёт другим контейнерам (s3-init).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-ip=s3", "-ip.bind=0.0.0.0", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=1024"]
    # наружу — только через proxy (https://localhost:8333): браузер ходит туда по подписанным ссылкам
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  # одноразово: бакет relay-files (идемпотентно)
  s3-init:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["sh", "/init-bucket.sh"]
    environment:
      MASTER: s3:9333
      BUCKET: relay-files
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3: { condition: service_healthy }

  # поиск сообщений (MIT, Community Edition): только текст и id чата, права проверяет сервер; порт наружу не публикуется
  search:
    image: getmeili/meilisearch:v1.55.0
    environment:
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      MEILI_NO_ANALYTICS: "true"
      MEILI_ENV: development
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
    volumes:
      - ./apps:/app/apps    # свежие миграции без пересборки образа
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "apps/web/build.ts", "--watch"]
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "--watch", "apps/server/src/main.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      PORT: "3000"
      DEV_LOGIN: "1"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      S3_PUBLIC_ENDPOINT: https://localhost:8333   # для подписанных ссылок браузеру (подпись включает хост); это proxy
      TRUST_PROXY: "1"                             # перед сервером ровно один прокси (nginx): X-Forwarded-* от него
      VALKEY_URL: redis://valkey:6379
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
    # наружу не открыт: только API за proxy
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

  # Вход: https://localhost — статика из dist (gzip/brotli), API и WebSocket → server, :8333 → S3.
  # Сертификат: docker/nginx/dev-cert.sh (mkcert).
  proxy:
    build: { context: docker/nginx }
    ports: ["443:443", "80:80", "8333:8333"]
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/http.d/default.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
      - ./apps/web/dist:/srv/dist:ro
    depends_on:
      server: { condition: service_started }
      web: { condition: service_started }
      s3: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    command: ["bun", "--watch", "apps/server/src/worker.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      DEV_LOGIN: "1"
      VALKEY_URL: redis://valkey:6379
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      S3_ENDPOINT: http://s3:8333    # uploads.sweep удаляет объекты брошенных загрузок
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  s3-init-test:
    image: chrislusf/seaweedfs:4.48
    profiles: ["test", "tools"]
    entrypoint: ["sh", "/init-bucket.sh"]
    environment:
      MASTER: s3:9333
      BUCKET: relay-test
    volumes:
      - ./docker/seaweedfs/init-bucket.sh:/init-bucket.sh:ro
    depends_on:
      s3: { condition: service_healthy }

  # перенос файлов со старого тома /data/files в бакет: docker compose --profile tools run --rm migrate-files
  migrate-files:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["tools"]
    command: ["bun", "apps/server/src/migrateFiles.ts"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      FILES_DIR: /data/files
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-files
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
    volumes:
      - ./apps:/app/apps
      - files:/data/files:ro
    depends_on:
      postgres: { condition: service_healthy }
      s3-init: { condition: service_completed_successfully }

  test:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["test"]
    working_dir: /app/apps/server
    command: ["bun", "test"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay_test
      DEV_LOGIN: "1"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-test
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      S3_PUBLIC_ENDPOINT: http://s3:8333
      VALKEY_URL: redis://valkey:6379
      RELAY_BUS_PREFIX: relay_test
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      SEARCH_INDEX_PREFIX: relay_test
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres: { condition: service_healthy }
      s3-init-test: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

  test-engine:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    profiles: ["test"]
    working_dir: /app/packages/sync-engine
    command: ["bun", "test"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay_test
      DEV_LOGIN: "1"
      S3_ENDPOINT: http://s3:8333
      S3_BUCKET: relay-test
      S3_ACCESS_KEY_ID: relaydev
      S3_SECRET_ACCESS_KEY: relaydevsecret
      S3_PUBLIC_ENDPOINT: http://s3:8333
      VALKEY_URL: redis://valkey:6379
      RELAY_BUS_PREFIX: relay_test
      SERVICE_CHAT: "off"   # без приветственного чата «Relay»: тесты считают чаты пользователя точно
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: relay-dev-master-key-change-me
      SEARCH_INDEX_PREFIX: relay_test
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    depends_on:
      postgres: { condition: service_healthy }
      s3-init-test: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
      search: { condition: service_healthy }

volumes:
  files:      # прежнее хранилище вложений: только для migrate-files
  pgdata: {}
  s3data: {}
  meili: {}
