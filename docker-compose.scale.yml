# Проверка масштабирования: docker compose -f docker-compose.yml -f docker-compose.scale.yml up -d --build
# (в worktree со своим docker-compose.override.yml — добавить и его: -f docker-compose.override.yml перед scale)
services:
  server2:
    extends: { file: docker-compose.yml, service: server }   # extends без file не видит сервис из другого файла
    ports: !reset []
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/relay.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["3080:80"]
    depends_on:
      server: { condition: service_started }
      server2: { condition: service_started }
